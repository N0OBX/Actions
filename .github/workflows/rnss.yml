name: Cross Repo Sync (Final)

on:
  schedule:
    - cron: "59 15 * * *"   # 11:59 PM Malaysia
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repo A
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Set branch name
      - name: Set branch
        run: |
          DATE=$(date +'%Y-%m-%d')
          echo "BRANCH=sync-$DATE" >> $GITHUB_ENV

      # 3. Apply ImmortalWrt commit (only changes)
      - name: Apply commit
        run: |
          git remote add immortalwrt https://github.com/laipeng668/immortalwrt.git
          git fetch immortalwrt
          git cherry-pick ec578d244e815f9b7e8c3216a09db3e061c5b630 || true

      # 4. Check if changes exist
      - name: Check changes
        run: |
          if [[ -z $(git status --porcelain) ]]; then
            echo "NO_CHANGES=true" >> $GITHUB_ENV
          fi

      # 5. Clone target repo using TOKEN
      - name: Clone target repo
        if: env.NO_CHANGES != 'true'
        run: |
          git clone https://x-access-token:${{ secrets.TARGET_REPO_TOKEN }}@github.com/N0OBX/Qcom-nss.git target

      # 6. Copy only changed files
      - name: Sync changed files
        if: env.NO_CHANGES != 'true'
        run: |
          cd target
          git checkout -b $BRANCH || git checkout $BRANCH
          cd ..

          git diff --name-only > changed.txt

          while read file; do
            mkdir -p "target/$(dirname "$file")"
            cp -f "$file" "target/$file"
          done < changed.txt

      # 7. Commit & push
      - name: Push changes
        if: env.NO_CHANGES != 'true'
        run: |
          cd target

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add .
          git commit -m "Sync: $BRANCH (ImmortalWrt selective)" || true
          git push origin $BRANCH
