name: Copy commit files to DOTYCAT

on:
  workflow_dispatch:

jobs:
  copy_commit_files:
    runs-on: ubuntu-latest

    steps:
      # 1. Clone ImmortalWrt
      - name: Clone ImmortalWrt
        run: |
          git clone https://github.com/laipeng668/immortalwrt.git
          cd immortalwrt
          git checkout ec578d244e815f9b7e8c3216a09db3e061c5b630

      # 2. List files changed in the commit
      - name: List files in commit
        run: |
          cd immortalwrt
          git diff-tree --no-commit-id --name-only -r ec578d244e815f9b7e8c3216a09db3e061c5b630 > ../changed.txt
          echo "Files in commit:"
          cat ../changed.txt

      # 3. Create DOTYCAT folder
      - name: Create DOTYCAT folder
        run: mkdir -p DOTYCAT

      # 4. Copy changed files into DOTYCAT, preserving folder structure
      - name: Copy files to DOTYCAT
        run: |
          while read file; do
            if [ -f "immortalwrt/$file" ]; then
              mkdir -p "DOTYCAT/$(dirname "$file")"
              cp -f "immortalwrt/$file" "DOTYCAT/$file"
            else
              echo "Skipping missing file: $file"
            fi
          done < changed.txt

      # 5. Optional: List files copied
      - name: List files copied
        run: |
          echo "Files copied into DOTYCAT:"
          find DOTYCAT -type f
