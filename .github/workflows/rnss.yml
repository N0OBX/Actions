name: Sync ImmortalWrt Commit to Empty Repo

on:
  schedule:
    - cron: "59 15 * * *"   # 11:59 PM MYT
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repo A
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Set branch name
      - name: Set branch
        run: |
          DATE=$(date +'%Y-%m-%d')
          echo "BRANCH=sync-$DATE" >> $GITHUB_ENV

      # 3. Apply ImmortalWrt commit
      - name: Apply ImmortalWrt commit
        run: |
          git remote add immortalwrt https://github.com/laipeng668/immortalwrt.git
          git fetch immortalwrt
          git cherry-pick ec578d244e815f9b7e8c3216a09db3e061c5b630 || true

      # 4. Check if any changes
      - name: Detect changes
        run: |
          if [[ -z $(git status --porcelain) ]]; then
            echo "NO_CHANGES=true" >> $GITHUB_ENV
          fi

      # 5. Create a temporary folder for target repo
      - name: Prepare target folder
        if: env.NO_CHANGES != 'true'
        run: |
          rm -rf target
          mkdir target
          cd target
          git init
          git checkout -b $BRANCH
          cd ..

      # 6. Copy ONLY changed files
      - name: Copy changed files
        if: env.NO_CHANGES != 'true'
        run: |
          git diff --name-only > changed.txt
          while read file; do
            mkdir -p "target/$(dirname "$file")"
            cp -f "$file" "target/$file"
          done < changed.txt

      # 7. Commit & push to empty target repo
      - name: Commit & Push
        if: env.NO_CHANGES != 'true'
        run: |
          cd target
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Sync ImmortalWrt commit $BRANCH" || true
          git remote add origin https://x-access-token:${{ secrets.TARGET_REPO_TOKEN }}@github.com/N0OBX/Qcom-nss.git
          git push -u origin $BRANCH

      # 8. No changes case
      - name: No changes
        if: env.NO_CHANGES == 'true'
        run: echo "Nothing to sync today"
