name: Sync Specific ImmortalWrt Commit

on:
  schedule:
    - cron: "59 15 * * *"  # Runs daily at 11:59 PM MYT
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source repo
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Set branch name with date + time (YYYY-MM-DD-HHMM)
      - name: Set branch
        run: |
          DATE=$(date +'%Y-%m-%d-%H%M')
          echo "BRANCH=sync-$DATE" >> $GITHUB_ENV
          echo "Branch will be: sync-$DATE"

      # 3. Fetch ImmortalWrt repository
      - name: Fetch ImmortalWrt
        run: |
          git remote add immortalwrt https://github.com/laipeng668/immortalwrt.git
          git fetch immortalwrt

      # 4. List files changed in the specific commit
      - name: List files in commit
        run: |
          git diff-tree --no-commit-id --name-only -r ec578d244e815f9b7e8c3216a09db3e061c5b630 > changed.txt
          echo "Files in commit:"
          cat changed.txt
          if [[ ! -s changed.txt ]]; then
            echo "NO_CHANGES=true" >> $GITHUB_ENV
          fi

      # 5. Prepare empty target repo folder
      - name: Prepare target folder
        if: env.NO_CHANGES != 'true'
        run: |
          rm -rf target
          mkdir target
          cd target
          git init
          git checkout -b $BRANCH
          cd ..

      # 6. Copy changed files preserving folder structure
      - name: Copy files from commit
        if: env.NO_CHANGES != 'true'
        run: |
          while read file; do
            if [ -f "$file" ]; then
              mkdir -p "target/$(dirname "$file")"
              cp -f "$file" "target/$file"
            else
              echo "Skipping missing file: $file"
            fi
          done < changed.txt

      # 7. Commit & push to empty target repo
      - name: Commit & Push
        if: env.NO_CHANGES != 'true'
        run: |
          cd target
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Sync ImmortalWrt commit ec578d244e815f9b7e8c3216a09db3e061c5b630 ($BRANCH)" || true
          git remote add origin https://x-access-token:${{ secrets.TARGET_REPO_TOKEN }}@github.com/N0OBX/Qcom-nss.git
          git push -u origin $BRANCH

      # 8. No changes case
      - name: No changes
        if: env.NO_CHANGES == 'true'
        run: echo "Nothing to sync from this commit"
