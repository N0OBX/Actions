name: Build And Release xcc

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Select source repository"
        required: true
        default: QSDK-25.12.2
        type: choice
        options:
          - QSDK-25.12.2
          - ITR1
          - TU02
          - immortalwrt

      config:
        description: "Select config file"
        required: true
        default: 25122
        type: choice
        options:
          - 25122
          - NSS-AW1K
          - AW1K
          - 5866T
          - FULL-AW1K
          - FULL-5866T

      version:
        description: "Version for release notes"
        required: true
        default: "V1.5.0"
        type: string

      upload_release:
        description: "Upload release to target repo?"
        required: true
        default: "no"
        type: choice
        options:
          - "yes"
          - "no"

permissions:
  contents: write

env:
  # Dynamic URL based on selection
  REPO_URL: ${{ github.event.inputs.source_repo == 'immortalwrt' && 'https://github.com/N0OBX/immortalwrt.git' || github.event.inputs.source_repo == 'ITR1' && 'https://github.com/N0OBX/ITR1.git' || github.event.inputs.source_repo == 'IPQ' && 'https://github.com/N0OBX/IPQ.git' || 'https://github.com/N0OBX/TU02.git' }}
  
  # Dynamic source directory
  SOURCE_DIR: ${{ github.event.inputs.source_repo == 'immortalwrt' && 'immortalwrt' || github.event.inputs.source_repo == 'ITR1' && 'ITR1' || github.event.inputs.source_repo == 'IPQ' && 'IPQ' || 'DOTYWRT' }}
  
  CONFIG_FILE: CONFIG/${{ github.event.inputs.config }}.config
  TZ: Asia/Kuala_Lumpur
  TARGET_REPO: dotywrt/DOTYWRT

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Setup Git auth (private access)
        run: |
          git config --global url."https://x-access-token:${{ secrets.TARGET_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Debug Input Values
        run: |
          echo "========================================="
          echo "INPUT SOURCE REPO: ${{ github.event.inputs.source_repo }}"
          echo "REPO URL: $REPO_URL"
          echo "SOURCE DIR: $SOURCE_DIR"
          echo "CONFIG FILE: $CONFIG_FILE"
          echo "========================================="

      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
            ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd gh

      # ============================================================
      # BUANG SEMUA CACHE - CLEAN TOTAL
      # ============================================================
      - name: Remove ALL caches and old builds
        run: |
          echo "Removing all cache directories..."
          
          # Remove source directories
          sudo rm -rf immortalwrt ITR1 IPQ DOTYWRT 2>/dev/null || true
          sudo rm -rf "$SOURCE_DIR" 2>/dev/null || true
          
          # Remove ccache
          sudo rm -rf ~/.ccache 2>/dev/null || true
          sudo rm -rf .ccache 2>/dev/null || true
          
          # Remove download and staging directories
          sudo rm -rf dl staging_dir 2>/dev/null || true
          sudo rm -rf tmp logs 2>/dev/null || true
          
          # Remove any cache files
          sudo rm -rf .cache .config.old 2>/dev/null || true
          sudo rm -rf .last_repo_selection 2>/dev/null || true
          
          echo "All caches removed successfully!"

      # ============================================================
      # FRESH CLONE - PASTIKAN REPO YANG BETUL
      # ============================================================
      - name: Fresh clone source repository
        run: |
          echo "Fresh cloning from: $REPO_URL"
          echo "Into directory: $SOURCE_DIR"
          
          # Clone fresh
          git clone --depth 1 "$REPO_URL" "$SOURCE_DIR"
          
          # Verify clone was successful
          if [ ! -d "$SOURCE_DIR" ]; then
            echo "ERROR: Failed to clone repository!"
            exit 1
          fi
          
          # Verify correct repo
          cd "$SOURCE_DIR"
          CLONED_URL=$(git config --get remote.origin.url)
          echo "Successfully cloned: $CLONED_URL"
          
          # Check if matches selected repo
          SELECTED="${{ github.event.inputs.source_repo }}"
          if [[ "$CLONED_URL" != *"$SELECTED"* ]]; then
            echo "ERROR: Cloned repository doesn't match selected source_repo!"
            echo "Expected: $SELECTED"
            echo "Actual: $CLONED_URL"
            exit 1
          fi
          
          echo "Repository verification passed!"

      # ============================================================
      # PREPARE FEEDS - TANPA CACHE
      # ============================================================
      - name: Prepare feeds
        run: |
          cd "$SOURCE_DIR"
          
          # Fix feeds.conf if needed
          if [ -f "feeds.conf.default" ]; then
            cp feeds.conf.default feeds.conf
          fi
          
          # Update feeds
          echo "Updating feeds..."
          ./scripts/feeds update -a
          
          # Install feeds
          echo "Installing feeds..."
          ./scripts/feeds install -a
          
          echo "Feeds prepared successfully!"

      - name: Load config
        run: |
          echo "Loading config from: $CONFIG_FILE"
          
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "ERROR: Config file not found: $CONFIG_FILE"
            echo "Available configs:"
            ls -la CONFIG/
            exit 1
          fi
          
          cp "$CONFIG_FILE" "$SOURCE_DIR/.config"
          echo "Config copied successfully"

      - name: Defconfig
        run: |
          cd "$SOURCE_DIR"
          make defconfig

      - name: Download sources
        run: |
          cd "$SOURCE_DIR"
          make download -j"$(nproc)"

      - name: Build firmware
        run: |
          cd "$SOURCE_DIR"
          
          echo "Starting build from: $(git config --get remote.origin.url)"
          echo "Build timestamp: $(date)"
          
          make -j"$(nproc)" || make -j1 V=s

      # ============================================================
      # GENERATE OUTPUT
      # ============================================================
      - name: Generate release tag
        id: tag
        run: |
          BUILD_TAG="AW1000-${{ github.event.inputs.source_repo }}-$(date +'%Y%m%d-%H%M')-${{ github.event.inputs.config }}"
          echo "tag=$BUILD_TAG" >> "$GITHUB_OUTPUT"
          echo "Generated tag: $BUILD_TAG"

      - name: Upload artifact (all bin)
        uses: actions/upload-artifact@v4
        with:
          name: AW1000-${{ github.event.inputs.source_repo }}-${{ github.event.inputs.config }}-${{ steps.tag.outputs.tag }}
          path: ${{ env.SOURCE_DIR }}/bin/**
          retention-days: 7
          if-no-files-found: warn

      - name: Prepare release files (ipq807x)
        if: ${{ github.event.inputs.upload_release == 'yes' }}
        run: |
          mkdir -p release_files
          TARGET_DIR="$SOURCE_DIR/bin/targets/qualcommax/ipq807x"
          
          # Check if directory exists
          if [ ! -d "$TARGET_DIR" ]; then
            echo "WARNING: Target directory not found: $TARGET_DIR"
            echo "Searching for bin files..."
            find "$SOURCE_DIR/bin" -name "*.bin" -type f 2>/dev/null || echo "No bin files found"
            exit 0
          fi

          # Copy files if they exist
          for file in "$TARGET_DIR"/*; do
            if [ -f "$file" ]; then
              cp -f "$file" release_files/
              echo "Copied: $(basename "$file")"
            fi
          done
          
          echo "Release files prepared: $(ls release_files/ | wc -l) files"

      - name: Generate release notes
        if: ${{ github.event.inputs.upload_release == 'yes' }}
        run: |
          cat > release_notes.md << EOF
          # AW1000 Firmware Release
          
          **Version:** ${{ github.event.inputs.version }}
          **Config:** ${{ github.event.inputs.config }}
          **Source Repository:** ${{ github.event.inputs.source_repo }}
          **Tag:** ${{ steps.tag.outputs.tag }}
          **Build Date:** $(date +"%Y-%m-%d %H:%M %Z")
          
          ## Source Information
          - Repository URL: $REPO_URL
          - Source Directory: $SOURCE_DIR
          
          ## WiFi Settings
          - SSID 2.4GHz: DOTYWRT 2G
          - SSID 5GHz: DOTYWRT 5G
          - Password: dotycat.com
          
          ## Login Information
          - Username: root
          - Password: (none)
          
          ## Build Notes
          - This build uses ${{ github.event.inputs.source_repo }} source repository
          - Config file: ${{ env.CONFIG_FILE }}
          - Clean build (no cache)
          EOF

      - name: Create release in target repo
        if: ${{ github.event.inputs.upload_release == 'yes' }}
        env:
          GITHUB_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
        run: |
          if [ -n "$(ls -A release_files 2>/dev/null)" ]; then
            echo "Creating release with files:"
            ls -la release_files/
            
            gh release create "${{ steps.tag.outputs.tag }}" release_files/* \
              --repo "${{ env.TARGET_REPO }}" \
              --title "AW1000 Firmware ${{ steps.tag.outputs.tag }}" \
              --notes-file release_notes.md
            
            echo "Release created successfully!"
          else
            echo "No files to release"
          fi
