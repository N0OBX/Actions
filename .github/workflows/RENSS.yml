name: SYNNS
on:
  workflow_dispatch:
  schedule:
    - cron: "59 15 * * *" # Daily at 11:59 PM MYT

jobs:
  sync_commit:
    runs-on: ubuntu-latest

    steps:
      # 0. Set timezone to Malaysia
      - name: Set timezone to Malaysia
        run: sudo timedatectl set-timezone Asia/Kuala_Lumpur

      # 1. Checkout workspace
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Set branch name with date + time (Malaysia timezone)
      - name: Set branch name
        run: |
          DATE=$(date +'%Y-%m-%d-%H%M')
          echo "BRANCH=$DATE" >> $GITHUB_ENV
          echo "Branch will be: $DATE"

      # 3. Clone REIPQ and checkout commit
      - name: Clone REIPQ at commit
        run: |
          git clone https://github.com/dotywrt/REIPQ.git
          cd REIPQ
          git checkout 907cfcf044d1ee370d0795c528a711ccc8d294b5

      # 4. List added/edited files in commit
      - name: List files in commit
        run: |
          cd REIPQ || exit 1
          git diff-tree --no-commit-id --name-only -r 39763a303f56dc80ce0640641e3f1093bc1ea44b > ../changed.txt
          echo "Files in commit:"
          cat ../changed.txt || true
          if [[ ! -s ../changed.txt ]]; then
            echo "NO_CHANGES=true" >> $GITHUB_ENV
          fi

      # 5. Create DOTYCAT folder and copy changed.txt
      - name: Create DOTYCAT folder
        if: env.NO_CHANGES != 'true'
        run: |
          mkdir -p DOTYCAT
          cp changed.txt DOTYCAT/changed.txt

      # 6. Copy changed files to DOTYCAT preserving folder structure
      - name: Copy files to DOTYCAT
        if: env.NO_CHANGES != 'true'
        run: |
          while read file; do
            if [ -f "REIPQ/$file" ]; then
              mkdir -p "DOTYCAT/$(dirname "$file")"
              cp -f "REIPQ/$file" "DOTYCAT/$file"
            else
              echo "Skipping missing file: $file"
            fi
          done < changed.txt

      # 7. Commit & push DOTYCAT folder to target repo
      - name: Commit & Push DOTYCAT
        if: env.NO_CHANGES != 'true'
        run: |
          cd DOTYCAT || exit 1
          git init
          git checkout -b $BRANCH
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add .
          if git diff --cached --quiet; then
            echo "No files to commit, skipping push"
            exit 0
          fi

          git commit -m "Personal Tailor (qualcommax)"
          git remote add origin https://x-access-token:${{ secrets.TARGET_REPO_TOKEN }}@github.com/N0OBX/Qcom-nss.git
          git push -u origin $BRANCH
