name: SYNNS NEW

on:
  workflow_dispatch:
  schedule:
    - cron: "59 15 * * *" # Daily at 11:59 PM MYT

permissions:
  contents: write

jobs:
  sync_commit:
    runs-on: ubuntu-latest

    steps:
      - name: Set timezone to Malaysia
        run: sudo timedatectl set-timezone Asia/Kuala_Lumpur

      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set branch name
        run: |
          DATE=$(date +'%Y-%m-%d-%H%M')
          echo "BRANCH=$DATE" >> $GITHUB_ENV
          echo "Branch will be: $DATE"

      - name: Clone VKING at commit
        run: |
          git clone https://x-access-token:${{ secrets.SOURCE_REPO_TOKEN }}@github.com/N0OBX/VKING.git
          cd VKING
          git checkout 13a0733ad0afd823e06bc17c1a2cecfcd3355224

      - name: List files in commit
        run: |
          cd VKING || exit 1
          git diff-tree --no-commit-id --name-only -r 13a0733ad0afd823e06bc17c1a2cecfcd3355224 > ../changed.txt
          echo "Files in commit:"
          cat ../changed.txt || true
          if [[ ! -s ../changed.txt ]]; then
            echo "NO_CHANGES=true" >> $GITHUB_ENV
          fi

      - name: Create DOTYCAT folder
        if: env.NO_CHANGES != 'true'
        run: |
          mkdir -p DOTYCAT
          cp changed.txt DOTYCAT/changed.txt

      - name: Copy files to DOTYCAT
        if: env.NO_CHANGES != 'true'
        run: |
          while read file; do
            if [ -f "VKING/$file" ]; then
              mkdir -p "DOTYCAT/$(dirname "$file")"
              cp -f "VKING/$file" "DOTYCAT/$file"
            else
              echo "Skipping missing file: $file"
            fi
          done < changed.txt

      - name: Commit & Push DOTYCAT
        if: env.NO_CHANGES != 'true'
        run: |
          cd DOTYCAT || exit 1
          git init
          git checkout -b "$BRANCH"
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add .
          if git diff --cached --quiet; then
            echo "No files to commit, skipping push"
            exit 0
          fi

          git commit -m "Personal Tailor (qualcommax)"
          git remote add origin https://x-access-token:${{ secrets.TARGET_REPO_TOKEN }}@github.com/N0OBX/Qcom-nss.git
          git push -u origin "$BRANCH"
