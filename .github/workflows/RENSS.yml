name: DOTYCAT

on:
  workflow_dispatch:
  schedule:
    - cron: "59 15 * * *" # Daily at 11:59 PM MYT

jobs:
  sync_commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set branch name (Malaysia time)
        run: |
          export TZ="Asia/Kuala_Lumpur"
          DATE=$(date +'%Y-%m-%d-%H%M')
          echo "BRANCH=sync-$DATE" >> $GITHUB_ENV
          echo "Branch will be: sync-$DATE"

      - name: Clone ImmortalWrt
        run: |
          git clone https://github.com/laipeng668/immortalwrt.git
          cd immortalwrt
          git checkout ec578d244e815f9b7e8c3216a09db3e061c5b630

      - name: List files in commit
        run: |
          cd immortalwrt || exit 1
          git show --pretty="" --name-only ec578d244e815f9b7e8c3216a09db3e061c5b630 > ../changed.txt
          echo "Files in commit:"
          cat ../changed.txt || true
          # Check if at least one file exists in immortalwrt
          FOUND=0
          while read file; do
            if [ -f "immortalwrt/$file" ]; then
              FOUND=1
              break
            fi
          done < ../changed.txt
          if [ $FOUND -eq 0 ]; then
            echo "NO_CHANGES=true" >> $GITHUB_ENV

      - name: Create DOTYCAT folder
        if: env.NO_CHANGES != 'true'
        run: mkdir -p DOTYCAT

      - name: Copy files to DOTYCAT
        if: env.NO_CHANGES != 'true'
        run: |
          echo "Copying files to DOTYCAT..."
          while read file; do
            if [ -f "immortalwrt/$file" ]; then
              mkdir -p "DOTYCAT/$(dirname "$file")"
              cp -f "immortalwrt/$file" "DOTYCAT/$file"
              echo "Copied: $file"
            else
              echo "Skipping missing file: $file"
            fi
          done < changed.txt

          # Copy changed.txt and README.md
          cp -f changed.txt DOTYCAT/changed.txt
          if [ -f "immortalwrt/README.md" ]; then
            cp -f immortalwrt/README.md DOTYCAT/README.md
          fi

      - name: Commit & Push DOTYCAT
        if: env.NO_CHANGES != 'true'
        run: |
          cd DOTYCAT || exit 1
          git init
          git checkout -b $BRANCH
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No files to commit, skipping push"
            exit 0
          fi
          git commit -m "Add files from ImmortalWrt commit ec578d244e815f9b7e8c3216a09db3e061c5b630"
          git remote add origin https://x-access-token:${{ secrets.TARGET_REPO_TOKEN }}@github.com/N0OBX/Qcom-nss.git
          git push -u origin $BRANCH

      - name: No changes
        if: env.NO_CHANGES == 'true'
        run: echo "No new or edited files to sync from this commit"
